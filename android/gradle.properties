# Build speed settings (safe for PCs with 8–16 GB RAM).
# 4 GB for Gradle is plenty for this app; asking for 8 GB made Windows swap to disk.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Keep Gradle running between builds, build modules in parallel, and reuse
# earlier results instead of rebuilding everything.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin: compile only what changed.
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx2G

android.useAndroidX=true
android.enableJetifier=true

# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Safety net: if any plugin still has a Java/Kotlin JVM-target mismatch,
# report it as a warning instead of failing the build.
kotlin.jvm.target.validation.mode=warning